name: Publish Packages

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to publish
                required: true
    release:
        types: [published]
    workflow_run:
        workflows: ["Create Release"]
        types: [completed]

jobs:
    publish:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'release' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        concurrency:
            group: publish-utils
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"
                  package-manager-cache: false
            - name: Verify release commit
              run: |
                  test "$(jq -r .name package.json)" = '@propagande/utils'
                  version=$(jq -r .version package.json)
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/v$version^{commit}")"
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun run test
            - run: bun run build
              id: build
            - name: Check whether the npm version is already published
              id: npm-version
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync, appendFileSync } from 'node:fs';
                  const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
                  const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
                  if (response.status !== 200 && response.status !== 404) {
                      throw new Error(`npm registry returned ${response.status}`);
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
                  NODE
            - name: Publish to npm
              if: steps.npm-version.outputs.published != 'true'
              run: |
                  version=$(jq -r .version package.json)
                  tag=latest
                  if [[ "$version" == *-* ]]; then tag=next; fi
                  npm publish --ignore-scripts --access public --tag "$tag"
            - name: Publish to GitHub Packages
              # Attempt this even if npm fails, once the shared build succeeds.
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
                  NPM_CONFIG_TOKEN: ${{ github.token }}
              run: |
                  npm pkg set name="@propagande-studio/utils"
                  bun publish --ignore-scripts --tolerate-republish --registry=https://npm.pkg.github.com
