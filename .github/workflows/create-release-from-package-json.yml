name: Create release

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Automatic GitHub Release
              uses: justincy/github-action-npm-release@2.0.2
